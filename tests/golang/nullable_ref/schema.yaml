$schema: "https://json-schema.org/draft/2020-12/schema"
title: NullableRefTests
$defs:
  Address:
    type: object
    properties:
      street:
        type: string
      city:
        type: string
    required:
      - street
      - city

  Container:
    type: object
    properties:
      name:
        type: string
      address:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/Address"
    required:
      - name
      - address
